<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 450" width="740" height="450" style="font-family: 'DejaVu Sans', Arial, sans-serif;">
  <style>
    text, tspan { stroke: none !important; stroke-width: 0 !important; }
    .title-main { font-size: 15px; font-weight: bold; fill: #64c8ff; }
    .card-title { font-size: 13px; font-weight: bold; fill: #ffffff; }
    .label-meta { font-size: 10px; font-weight: bold; fill: #8c96a5; letter-spacing: 0.5px; }
    .label-sub { font-size: 10px; fill: #8c96a5; }
    .val-code { font-size: 12px; font-family: monospace; font-weight: bold; fill: #64c8ff; }
    .val-hex { font-size: 11px; font-family: monospace; font-weight: bold; fill: #ffa032; }
    .val-size { font-size: 13px; font-weight: bold; fill: #ffffff; }
    .sp-title { font-size: 13px; font-weight: bold; fill: #ffa032; }
    .sp-sub { font-size: 10px; fill: #ffb86c; }
  </style>

  <defs>
    <!-- Marcador de flecha naranja -->
    <marker id="arrow-sp" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ffa032"/>
    </marker>
  </defs>

  <!-- ================= STACK POINTER (SP) ================= -->
  <g transform="translate(245, 10)">
    <rect x="0" y="0" width="250" height="44" rx="8" fill="#26180a" stroke="#ffa032" stroke-width="1.8"/>
    <text x="125" y="19" text-anchor="middle" class="sp-title">Stack Pointer (SP)</text>
    <text x="125" y="34" text-anchor="middle" class="sp-sub">Apunta al tope actual del Stack</text>
  </g>

  <!-- Flecha desde SP hacia la cima del Stack -->
  <line x1="370" y1="54" x2="370" y2="82" stroke="#ffa032" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-sp)"/>

  <!-- ================= TITULO DEL STACK ================= -->
  <text x="20" y="76" class="title-main">STACK (LIFO)</text>

  <!-- ================= VARIABLE 2: activo: bool = true (CIMA DE STACK) ================= -->
  <g transform="translate(10, 95)">
    <!-- Marco de la variable -->
    <rect x="0" y="0" width="720" height="135" rx="8" fill="#141c2b" stroke="#2d3c5a" stroke-width="1.2"/>
    
    <!-- Encabezado de la variable -->
    <rect x="15" y="10" width="220" height="24" rx="4" fill="#080c12" stroke="#64c8ff" stroke-width="1"/>
    <text x="125" y="26" text-anchor="middle" class="card-title">activo: bool = true</text>

    <!-- Sub-caja 1: Memory Address -->
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="215" height="75" rx="6" fill="#080c12" stroke="#64c8ff" stroke-width="1.2"/>
      <text x="107" y="24" text-anchor="middle" class="label-meta">MEMORY ADDRESS</text>
      <text x="107" y="48" text-anchor="middle" class="val-code">0x7FFEE4B2A894</text>
      <text x="107" y="64" text-anchor="middle" class="label-sub">Tope del Stack (SP)</text>
    </g>

    <!-- Sub-caja 2: Size -->
    <g transform="translate(250, 45)">
      <rect x="0" y="0" width="215" height="75" rx="6" fill="#080c12" stroke="#456090" stroke-width="1.2"/>
      <text x="107" y="24" text-anchor="middle" class="label-meta">SIZE</text>
      <text x="107" y="48" text-anchor="middle" class="val-size">1 Byte (8 bits)</text>
      <text x="107" y="64" text-anchor="middle" class="label-sub">Fixed size</text>
    </g>

    <!-- Sub-caja 3: Value -->
    <g transform="translate(485, 45)">
      <rect x="0" y="0" width="220" height="75" rx="6" fill="#080c12" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="110" y="24" text-anchor="middle" class="label-meta">VALUE</text>
      <text x="110" y="46" text-anchor="middle" class="val-code">00000001</text>
      <text x="110" y="64" text-anchor="middle" class="val-hex">Hex: 0x01 (true)</text>
    </g>
  </g>

  <!-- ================= VARIABLE 1: edad: i32 = 25 (BASE DE STACK) ================= -->
  <g transform="translate(10, 245)">
    <!-- Marco de la variable -->
    <rect x="0" y="0" width="720" height="165" rx="8" fill="#141c2b" stroke="#2d3c5a" stroke-width="1.2"/>
    
    <!-- Encabezado de la variable -->
    <rect x="15" y="10" width="220" height="24" rx="4" fill="#080c12" stroke="#64c8ff" stroke-width="1"/>
    <text x="125" y="26" text-anchor="middle" class="card-title">edad: i32 = 25</text>

    <!-- Sub-caja 1: Memory Address -->
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="215" height="105" rx="6" fill="#080c12" stroke="#64c8ff" stroke-width="1.2"/>
      <text x="107" y="24" text-anchor="middle" class="label-meta">MEMORY ADDRESS</text>
      <text x="107" y="52" text-anchor="middle" class="val-code">0x7FFEE4B2A890</text>
      <text x="107" y="76" text-anchor="middle" class="label-sub">4 bytes contiguos</text>
      <text x="107" y="92" text-anchor="middle" class="label-sub">(0x890 a 0x893)</text>
    </g>

    <!-- Sub-caja 2: Size -->
    <g transform="translate(250, 45)">
      <rect x="0" y="0" width="215" height="105" rx="6" fill="#080c12" stroke="#456090" stroke-width="1.2"/>
      <text x="107" y="24" text-anchor="middle" class="label-meta">SIZE</text>
      <text x="107" y="52" text-anchor="middle" class="val-size">4 Bytes (32 bits)</text>
      <text x="107" y="76" text-anchor="middle" class="label-sub">1 Byte = 8 bits</text>
      <text x="107" y="92" text-anchor="middle" class="label-sub">4 * 8 = 32 bits</text>
    </g>

    <!-- Sub-caja 3: Value -->
    <g transform="translate(485, 45)">
      <rect x="0" y="0" width="220" height="105" rx="6" fill="#080c12" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="110" y="22" text-anchor="middle" class="label-meta">VALUE</text>
      <text x="110" y="42" text-anchor="middle" class="val-code">00000000 00000000</text>
      <text x="110" y="60" text-anchor="middle" class="val-code">00000000 00011001</text>
      <text x="110" y="86" text-anchor="middle" class="val-hex">Hex: 0x00000019 (25)</text>
    </g>
  </g>
</svg>
