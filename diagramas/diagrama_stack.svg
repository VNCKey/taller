<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 535" width="760" height="535" style="background-color: #0e121a; font-family: 'DejaVu Sans', Arial, sans-serif;">
  <style>
    text, tspan { stroke: none !important; stroke-width: 0 !important; }
    .title-main { font-size: 14px; font-weight: bold; fill: #64c8ff; }
    .subtitle { font-size: 11px; fill: #8c96a5; }
    .card-title { font-size: 13px; font-weight: bold; fill: #ffffff; }
    .label-meta { font-size: 10px; fill: #8c96a5; }
    .val-code { font-size: 12px; font-family: monospace; font-weight: bold; fill: #64c8ff; }
    .val-hex { font-size: 11px; font-family: monospace; font-weight: bold; fill: #ffa032; }
    .val-size { font-size: 13px; font-weight: bold; fill: #ffffff; }
    .sp-title { font-size: 13px; font-weight: bold; fill: #ffa032; }
    .sp-sub { font-size: 10px; fill: #ffb86c; }
  </style>

  <defs>
    <!-- Marcador de flecha naranja -->
    <marker id="arrow-sp" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ffa032"/>
    </marker>
  </defs>

  <!-- ================= STACK POINTER (SP) ================= -->
  <g transform="translate(255, 20)">
    <rect x="0" y="0" width="250" height="46" rx="8" fill="#26180a" stroke="#ffa032" stroke-width="1.8"/>
    <text x="125" y="20" text-anchor="middle" class="sp-title">Stack Pointer (SP - CPU)</text>
    <text x="125" y="36" text-anchor="middle" class="sp-sub">Apunta al tope actual de la pila</text>
  </g>

  <!-- Flecha desde SP hacia la cima del Stack -->
  <line x1="380" y1="66" x2="380" y2="108" stroke="#ffa032" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-sp)"/>

  <!-- ================= CONTENEDOR PRINCIPAL: STACK ================= -->
  <rect x="40" y="115" width="680" height="395" rx="10" fill="#101520" stroke="#324468" stroke-width="1.5"/>
  
  <text x="60" y="142" class="title-main">STACK (Memoria en Pila - LIFO)</text>
  <text x="60" y="160" class="subtitle">Celdas fijas contiguas asignadas en tiempo de compilacion sin punteros externos</text>

  <!-- ================= VARIABLE 2: activo: bool = true (CIMA DE PILA) ================= -->
  <g transform="translate(60, 175)">
    <!-- Marco de la variable -->
    <rect x="0" y="0" width="640" height="135" rx="8" fill="#141c2b" stroke="#2d3c5a" stroke-width="1.2"/>
    
    <!-- Encabezado de la variable -->
    <rect x="15" y="10" width="220" height="24" rx="4" fill="#080c12" stroke="#64c8ff" stroke-width="1"/>
    <text x="125" y="26" text-anchor="middle" class="card-title">activo: bool = true</text>

    <!-- Sub-caja 1: Direccion -->
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="190" height="75" rx="6" fill="#080c12" stroke="#64c8ff" stroke-width="1.2"/>
      <text x="95" y="24" text-anchor="middle" class="label-meta">DIRECCION DE MEMORIA</text>
      <text x="95" y="48" text-anchor="middle" class="val-code">0x7FFEE4B2A894</text>
      <text x="95" y="64" text-anchor="middle" class="label-meta">Tope actual (SP)</text>
    </g>

    <!-- Sub-caja 2: Tamanio -->
    <g transform="translate(225, 45)">
      <rect x="0" y="0" width="190" height="75" rx="6" fill="#080c12" stroke="#456090" stroke-width="1.2"/>
      <text x="95" y="24" text-anchor="middle" class="label-meta">TAMANIO EXACTO</text>
      <text x="95" y="48" text-anchor="middle" class="val-size">1 Byte (8 bits)</text>
      <text x="95" y="64" text-anchor="middle" class="label-meta">Tamanio fijo en compilacion</text>
    </g>

    <!-- Sub-caja 3: Valor Binario / Hex -->
    <g transform="translate(435, 45)">
      <rect x="0" y="0" width="190" height="75" rx="6" fill="#080c12" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="95" y="24" text-anchor="middle" class="label-meta">CONTENIDO EN BYTES</text>
      <text x="95" y="46" text-anchor="middle" class="val-code">00000001</text>
      <text x="95" y="64" text-anchor="middle" class="val-hex">Hex: 0x01 (true)</text>
    </g>
  </g>

  <!-- ================= VARIABLE 1: edad: i32 = 25 (BASE DE PILA) ================= -->
  <g transform="translate(60, 325)">
    <!-- Marco de la variable -->
    <rect x="0" y="0" width="640" height="165" rx="8" fill="#141c2b" stroke="#2d3c5a" stroke-width="1.2"/>
    
    <!-- Encabezado de la variable -->
    <rect x="15" y="10" width="220" height="24" rx="4" fill="#080c12" stroke="#64c8ff" stroke-width="1"/>
    <text x="125" y="26" text-anchor="middle" class="card-title">edad: i32 = 25</text>

    <!-- Sub-caja 1: Direccion -->
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="190" height="105" rx="6" fill="#080c12" stroke="#64c8ff" stroke-width="1.2"/>
      <text x="95" y="24" text-anchor="middle" class="label-meta">DIRECCION DE MEMORIA</text>
      <text x="95" y="52" text-anchor="middle" class="val-code">0x7FFEE4B2A890</text>
      <text x="95" y="76" text-anchor="middle" class="label-meta">4 bytes contiguos</text>
      <text x="95" y="92" text-anchor="middle" class="label-meta">(0x890 a 0x893)</text>
    </g>

    <!-- Sub-caja 2: Tamanio -->
    <g transform="translate(225, 45)">
      <rect x="0" y="0" width="190" height="105" rx="6" fill="#080c12" stroke="#456090" stroke-width="1.2"/>
      <text x="95" y="24" text-anchor="middle" class="label-meta">TAMANIO EXACTO</text>
      <text x="95" y="52" text-anchor="middle" class="val-size">4 Bytes (32 bits)</text>
      <text x="95" y="76" text-anchor="middle" class="label-meta">1 Byte = 8 bits</text>
      <text x="95" y="92" text-anchor="middle" class="label-meta">4 * 8 = 32 bits fijos</text>
    </g>

    <!-- Sub-caja 3: Valor Binario / Hex -->
    <g transform="translate(435, 45)">
      <rect x="0" y="0" width="190" height="105" rx="6" fill="#080c12" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="95" y="22" text-anchor="middle" class="label-meta">CONTENIDO EN BYTES</text>
      <text x="95" y="42" text-anchor="middle" class="val-code">00000000 00000000</text>
      <text x="95" y="60" text-anchor="middle" class="val-code">00000000 00011001</text>
      <text x="95" y="86" text-anchor="middle" class="val-hex">Hex: 0x00000019 (25)</text>
    </g>
  </g>
</svg>
