<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" style="font-family: 'DejaVu Sans', Arial, sans-serif;">
  <style>
    text, tspan { stroke: none !important; stroke-width: 0 !important; }
    .title-main { font-size: 15px; font-weight: bold; fill: #ffa032; }
    .card-title { font-size: 13px; font-weight: bold; fill: #ffffff; }
    .card-title-heap { font-size: 13px; font-weight: bold; fill: #ffa032; }
    .label-meta { font-size: 10px; font-weight: bold; fill: #8c96a5; letter-spacing: 0.5px; }
    .label-sub { font-size: 10px; fill: #8c96a5; }
    .val-code { font-size: 12px; font-family: monospace; font-weight: bold; fill: #64c8ff; }
    .val-ptr { font-size: 12px; font-family: monospace; font-weight: bold; fill: #ffa032; }
    .val-char { font-size: 15px; font-family: monospace; font-weight: bold; fill: #ffffff; }
    .val-byte { font-size: 10px; font-family: monospace; fill: #ffa032; }
  </style>

  <defs>
    <!-- Marcador de flecha naranja para el puntero -->
    <marker id="arrow-ptr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ffa032"/>
    </marker>
  </defs>

  <!-- ================= TITULO PRINCIPAL ================= -->
  <text x="20" y="30" class="title-main">HEAP</text>

  <!-- ================= COLUMNA IZQUIERDA: STACK ================= -->
  <g transform="translate(20, 45)">
    <!-- Marco Stack -->
    <rect x="0" y="0" width="370" height="365" rx="8" fill="#141c2b" stroke="#2d3c5a" stroke-width="1.2"/>
    
    <!-- Encabezado de la variable -->
    <rect x="15" y="12" width="280" height="26" rx="4" fill="#080c12" stroke="#64c8ff" stroke-width="1"/>
    <text x="155" y="29" text-anchor="middle" class="card-title">texto: String = String::from("Rust")</text>

    <!-- Sub-caja 1: Memory Address en Stack -->
    <g transform="translate(15, 48)">
      <rect x="0" y="0" width="340" height="52" rx="6" fill="#080c12" stroke="#64c8ff" stroke-width="1.2"/>
      <text x="15" y="20" class="label-meta">STACK MEMORY ADDRESS</text>
      <text x="15" y="38" class="val-code">0x7FFEE4B2A890 (24 Bytes)</text>
    </g>

    <!-- Sub-caja 2: Estructura interna de 3 campos -->
    <g transform="translate(15, 110)">
      <rect x="0" y="0" width="340" height="240" rx="6" fill="#080c12" stroke="#456090" stroke-width="1.2"/>
      <text x="15" y="22" class="label-meta">STACK METADATA (3 CAMPOS - 24B)</text>
      
      <!-- Campo 1: ptr -->
      <g transform="translate(10, 32)">
        <rect x="0" y="0" width="320" height="60" rx="4" fill="#26180a" stroke="#ffa032" stroke-width="1.2"/>
        <text x="12" y="24" class="val-ptr">ptr: 0x55A8F210E400</text>
        <text x="12" y="46" class="label-sub">8 Bytes - Puntero de 64-bit hacia el Heap</text>
      </g>

      <!-- Campo 2: len -->
      <g transform="translate(10, 100)">
        <rect x="0" y="0" width="320" height="60" rx="4" fill="#141c2b" stroke="#38bdf8" stroke-width="1"/>
        <text x="12" y="24" class="val-code">len: 4</text>
        <text x="12" y="46" class="label-sub">8 Bytes (usize) - Bytes usados: "Rust"</text>
      </g>

      <!-- Campo 3: cap -->
      <g transform="translate(10, 168)">
        <rect x="0" y="0" width="320" height="60" rx="4" fill="#141c2b" stroke="#38bdf8" stroke-width="1"/>
        <text x="12" y="24" class="val-code">cap: 4</text>
        <text x="12" y="46" class="label-sub">8 Bytes (usize) - Capacidad total reservada</text>
      </g>
    </g>
  </g>

  <!-- ================= FLECHA DE PUNTERO (STACK -> HEAP) ================= -->
  <path d="M 365 210 L 415 210" stroke="#ffa032" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrow-ptr)" fill="none"/>

  <!-- ================= COLUMNA DERECHA: HEAP ================= -->
  <g transform="translate(430, 45)">
    <!-- Marco Heap -->
    <rect x="0" y="0" width="370" height="365" rx="8" fill="#141c2b" stroke="#ffa032" stroke-width="1.2"/>
    
    <!-- Encabezado Heap -->
    <rect x="15" y="12" width="220" height="26" rx="4" fill="#26180a" stroke="#ffa032" stroke-width="1"/>
    <text x="125" y="29" text-anchor="middle" class="card-title-heap">HEAP BUFFER: "Rust"</text>

    <!-- Sub-caja 1: Memory Address en Heap -->
    <g transform="translate(15, 48)">
      <rect x="0" y="0" width="340" height="52" rx="6" fill="#080c12" stroke="#ffa032" stroke-width="1.2"/>
      <text x="15" y="20" class="label-meta">HEAP MEMORY ADDRESS</text>
      <text x="15" y="38" class="val-ptr">0x55A8F210E400 (Destino)</text>
    </g>

    <!-- Sub-caja 2: Contenido en bytes del buffer -->
    <g transform="translate(15, 110)">
      <rect x="0" y="0" width="340" height="240" rx="6" fill="#080c12" stroke="#456090" stroke-width="1.2"/>
      <text x="15" y="22" class="label-meta">CONTENIDO UTF-8 EN HEAP</text>
      
      <!-- Celdas de caracteres -->
      <g transform="translate(10, 36)">
        <!-- Byte 0: 'R' -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="74" height="80" rx="4" fill="#26180a" stroke="#ffa032" stroke-width="1.2"/>
          <text x="37" y="22" text-anchor="middle" class="label-sub">[0]</text>
          <text x="37" y="48" text-anchor="middle" class="val-char">'R'</text>
          <text x="37" y="68" text-anchor="middle" class="val-byte">0x52</text>
        </g>

        <!-- Byte 1: 'u' -->
        <g transform="translate(82, 0)">
          <rect x="0" y="0" width="74" height="80" rx="4" fill="#26180a" stroke="#ffa032" stroke-width="1.2"/>
          <text x="37" y="22" text-anchor="middle" class="label-sub">[1]</text>
          <text x="37" y="48" text-anchor="middle" class="val-char">'u'</text>
          <text x="37" y="68" text-anchor="middle" class="val-byte">0x75</text>
        </g>

        <!-- Byte 2: 's' -->
        <g transform="translate(164, 0)">
          <rect x="0" y="0" width="74" height="80" rx="4" fill="#26180a" stroke="#ffa032" stroke-width="1.2"/>
          <text x="37" y="22" text-anchor="middle" class="label-sub">[2]</text>
          <text x="37" y="48" text-anchor="middle" class="val-char">'s'</text>
          <text x="37" y="68" text-anchor="middle" class="val-byte">0x73</text>
        </g>

        <!-- Byte 3: 't' -->
        <g transform="translate(246, 0)">
          <rect x="0" y="0" width="74" height="80" rx="4" fill="#26180a" stroke="#ffa032" stroke-width="1.2"/>
          <text x="37" y="22" text-anchor="middle" class="label-sub">[3]</text>
          <text x="37" y="48" text-anchor="middle" class="val-char">'t'</text>
          <text x="37" y="68" text-anchor="middle" class="val-byte">0x74</text>
        </g>
      </g>

      <!-- Resumen explicativo compacto -->
      <g transform="translate(10, 130)">
        <rect x="0" y="0" width="320" height="96" rx="4" fill="#141c2b" stroke="#2d3c5a" stroke-width="1"/>
        <text x="12" y="22" class="label-meta">PROPIEDADES:</text>
        <text x="12" y="42" class="label-sub">SIZE: 4 Bytes UTF-8 | CAP: 4 Bytes</text>
        <text x="12" y="62" class="label-sub">Asignado dinamicamente en tiempo de ejecucion</text>
        <text x="12" y="82" class="label-sub">Liberado por drop(texto) al salir del scope</text>
      </g>
    </g>
  </g>
</svg>
